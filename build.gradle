/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
        }
    }
}

plugins {
    // Note for FTC Teams: Do not modify this yourself.
    id 'com.android.application' version '9.4.1' apply false
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
    }
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
        }
    }
    configurations.configureEach { config ->
        if (config.name == 'androidLintTool') {
            config.resolutionStrategy.dependencySubstitution {
                substitute module('com.android.tools.lint:lint-gradle') using module('com.android.tools.build:gradle:9.4.1')
            }
        }
    }
}

repositories {
    mavenCentral()
}
